<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasmer Spike Phase 0</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; margin-bottom: 1rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 0.9em; }
    .status { margin-bottom: 1rem; font-weight: bold; }
    .status.running { color: orange; }
    .status.pass { color: green; }
    .status.fail { color: red; }
    .log-container { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Phase 0: Edge.js Spike Tests</h1>
  
  <div class="controls">
    <button id="btn-t0">Run T0 (Diagnostic)</button>
    <button id="btn-t1">Run T1 (Hello World)</button>
    <button id="btn-t2">Run T2 (Edge.js Boots)</button>
    <button id="btn-t3">Run T3 (VFS + fs)</button>
    <button id="btn-t4">Run T4 (Outbound HTTP)</button>
    <button id="btn-t5">Run T5 (Module Resolution)</button>
    <button id="btn-t6">Run T6 (Real Skill)</button>
    <button id="btn-run-all">Run All</button>
  </div>

  <div id="status" class="status">Ready</div>
  
  <div class="log-container">
    <pre id="output">Output will appear here...</pre>
  </div>

  <script type="module" src="/src/runner.ts"></script>
</body>
</html>
