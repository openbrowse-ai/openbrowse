# Dependabot keeps npm dependencies and GitHub Actions up to date.
# Schedule is weekly to limit PR volume; minor + patch updates are
# grouped per-ecosystem to avoid noise.

version: 2
updates:
  # Root + workspaces (pnpm). Dependabot follows pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - automated
      - area:ci
    commit-message:
      prefix: "chore(actions)"
