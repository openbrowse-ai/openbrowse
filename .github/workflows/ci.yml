name: CI

# PR-gating checks for the monorepo. Runs typecheck + tests + a docs
# build sanity check on every PR targeting main and on every push to
# main itself.
#
# On PRs, also builds an installable extension zip and posts a sticky
# comment with a download link so reviewers can install the PR build
# without running pnpm dev locally.
#
# Designed to be cheap (~2-3 min) so it doesn't slow review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # On pull requests, cancel older runs for the same PR.
  # On main, never cancel — keep every default-branch run for a clean history.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm compile

      - name: Test (extension)
        run: pnpm test

      - name: Build docs site (sanity)
        run: pnpm -F openbrowse-docs build

  pr-build:
    name: PR build (extension zip)
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + zip extension
        run: pnpm zip

      - name: Resolve zip path
        id: zip
        run: |
          path=$(ls apps/extension/.output/openbrowse-*-chrome.zip | head -1)
          name=$(basename "$path" .zip)
          # Decorate the artifact name with the PR number + short SHA so
          # downloads are easy to tell apart across multiple PR runs.
          short_sha="${GITHUB_SHA:0:7}"
          artifact_name="${name}-pr${{ github.event.pull_request.number }}-${short_sha}"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.zip.outputs.artifact_name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Comment on PR with artifact link
        # Forks have a read-only GITHUB_TOKEN, so the comment will fail
        # there. Reviewers can still find the artifact in the Actions
        # tab, so don't fail the build.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-build
          message: |
            ### Installable build for this PR

            **Download:** [${{ steps.zip.outputs.artifact_name }}.zip](${{ steps.upload.outputs.artifact-url }})
            (Built from `${{ github.event.pull_request.head.sha }}`. Available for 14 days.)

            <details><summary>Install in Chrome (~30 seconds)</summary>

            1. Click the download link above and unzip the archive.
            2. Open `chrome://extensions`.
            3. Toggle **Developer mode** on (top right).
            4. Click **Load unpacked** and select the unzipped folder.

            </details>

            <sub>Updated automatically on every push.</sub>
