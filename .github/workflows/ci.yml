name: CI

# PR-gating checks for the monorepo. Runs typecheck + tests + a docs
# build sanity check on every PR targeting main and on every push to
# main itself.
#
# Designed to be cheap (~2-3 min) so it doesn't slow review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # On pull requests, cancel older runs for the same PR.
  # On main, never cancel — keep every default-branch run for a clean history.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm compile

      - name: Test (extension)
        run: pnpm test

      - name: Build docs site (sanity)
        run: pnpm -F openbrowse-docs build
