name: Release extension

# Builds the Chrome extension and publishes it as a GitHub Release.
#
# Three trigger paths:
#   - `push: tags: [v*, openbrowse@*]` — fires when a tag is pushed
#     by a real user/credential. (Tags pushed by GITHUB_TOKEN do NOT
#     trigger this — that's GitHub's anti-recursion safeguard, which
#     is why the Changesets workflow uses workflow_call below.)
#   - `workflow_call` — invoked by `changesets.yml` after it creates
#     a release tag. This is the primary path for normal releases.
#     NOTE: inside a called workflow, `github.event_name` reflects the
#     CALLER's event (here: `push` to main), NOT `workflow_call`. So
#     the tag is resolved from the `tag` input, never by branching on
#     the event name — see the Resolve tag step below.
#   - `workflow_dispatch` — manual escape hatch for re-running the
#     build/upload against an existing tag (e.g. transient CI failure
#     that left a release without its zip).
#
# The workflow asserts that the resolved version matches
# apps/extension/package.json so a tag/manifest mismatch fails fast
# rather than producing a confusing release.
#
# Chrome Web Store upload is intentionally NOT automated — keep that
# as a deliberate human step. The runbook lives at
# /docs/contributing/development#cutting-a-release.

on:
  push:
    tags:
      - "v*"
      - "openbrowse@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. openbrowse@0.2.2 or v0.1.0)"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Tag to build"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - name: Resolve tag
        id: tag
        # Pass inputs through env rather than `${{ ... }}` interpolation
        # in the shell body. workflow_dispatch.inputs.tag is operator-
        # controlled and would otherwise be substituted before the shell
        # parses the script — i.e. a classic command-injection vector.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # workflow_dispatch and workflow_call both populate INPUT_TAG,
          # which is the source of truth whenever it is set. We do NOT
          # branch on github.event_name: in a workflow_call'd reusable
          # workflow it reflects the CALLER's event (here `push`), not
          # `workflow_call`, so an event-name switch would wrongly fall
          # through to the push arm and read refs/heads/main as the tag.
          # A real tag-push event leaves INPUT_TAG empty, so we fall
          # back to the pushed ref in that case.
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Validate format before doing anything with TAG. Accept the
          # two formats this repo actually produces: 'vX.Y.Z' (legacy)
          # and 'openbrowse@X.Y.Z' (Changesets workspace tag), each
          # with optional semver prerelease/build metadata.
          if ! printf '%s' "$TAG" | grep -Eq '^(v|openbrowse@)[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::Invalid tag format: '$TAG' (expected vX.Y.Z or openbrowse@X.Y.Z)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip whichever prefix is present. Changesets tags
          # private workspace packages as 'openbrowse@X.Y.Z'; legacy
          # tags use 'vX.Y.Z'. We accept both so workflow_dispatch
          # against old tags still works.
          VERSION="${TAG#v}"
          VERSION="${VERSION#openbrowse@}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches manifest version
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./apps/extension/package.json').version")
          echo "Tag version:      $TAG_VERSION"
          echo "Manifest version: $PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match apps/extension/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build + zip extension
        run: pnpm zip

      - name: Verify manifest key field is pinned
        run: |
          ZIP=$(ls apps/extension/.output/openbrowse-*-chrome.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No release zip found in apps/extension/.output/"
            exit 1
          fi
          echo "Inspecting $ZIP"
          unzip -p "$ZIP" manifest.json | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const k = m.key || "";
            if (k.length < 300) {
              console.error("::error::manifest is missing the pinned `key` field (length " + k.length + ")");
              process.exit(1);
            }
            console.log("ok: manifest key length", k.length);
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Display the release on the Releases page as 'vX.Y.Z' even
          # though the underlying tag is 'openbrowse@X.Y.Z' (Changesets
          # workspace format). Keeps the GH release UI clean and
          # backwards-compatible with the v0.1.x / v0.2.x history.
          name: v${{ steps.tag.outputs.version }}
          files: apps/extension/.output/openbrowse-*-chrome.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
