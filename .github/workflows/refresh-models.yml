name: Refresh models.dev snapshot

# Runs the snapshot refresher against models.dev/api.json on a schedule
# and opens a PR if anything changed. This keeps the bundled fallback
# fresh without manual maintenance.

on:
  schedule:
    # Daily at 04:00 UTC.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed snapshot
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh snapshot
        run: pnpm refresh:models

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet apps/extension/src/registry/models-dev/snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if snapshot changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/refresh-models-snapshot
          delete-branch: true
          title: "chore: refresh models.dev snapshot"
          commit-message: "chore: refresh models.dev snapshot"
          body: |
            Automated refresh of the bundled `models.dev` snapshot.

            See `.github/workflows/refresh-models.yml` for the schedule.
          labels: |
            automated
            models.dev
