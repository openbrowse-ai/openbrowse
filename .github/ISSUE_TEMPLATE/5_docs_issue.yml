name: Documentation issue
description: Something in the docs is wrong, missing, or unclear.
title: "docs: "
labels: ["documentation", "area:docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: "https://openbrowse.ai/docs/..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong, missing, or unclear?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
