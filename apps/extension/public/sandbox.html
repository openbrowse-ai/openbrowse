<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<script>
"use strict";

const DEFAULT_TIMEOUT_MS = 30000;
const MAX_TIMEOUT_MS = 120000;
const MAX_OUTPUT_BYTES = 1048576;

// AsyncFunction has no globally-named constructor; reach it via an instance
// of an async arrow. Using AsyncFunction (not the synchronous Function ctor)
// lets the agent's body use TOP-LEVEL `await` directly — the V8 parser
// only allows `await` inside an async function body, and `new Function(...)`
// produces a sync function. Sync `Function` was the source of the
// "await is only valid in async functions" error agents kept hitting.
const AsyncFunction = (async () => {}).constructor;

window.addEventListener("message", async (e) => {
  const { id, code, input, unboundedOutput, timeoutMs } = e.data;
  if (!id || !code) return;

  // Clamp timeout: caller-supplied value is bounded by [1ms, MAX_TIMEOUT_MS].
  // The host (`sandbox.ts`) also clamps before sending; the cap here is
  // belt-and-suspenders against a stale or malicious sender.
  const effectiveTimeoutMs = Math.min(
    Math.max(typeof timeoutMs === "number" ? timeoutMs : DEFAULT_TIMEOUT_MS, 1),
    MAX_TIMEOUT_MS,
  );

  let timeoutId = null;
  let resolved = false;

  function reply(result) {
    if (resolved) return;
    resolved = true;
    if (timeoutId) clearTimeout(timeoutId);
    e.source.postMessage({ id, ...result }, "*");
  }

  timeoutId = setTimeout(() => {
    reply({ error: "Execution timed out after " + effectiveTimeoutMs + "ms", logs: [] });
  }, effectiveTimeoutMs);

  const __logs = [];
  const origLog = console.log;
  const origWarn = console.warn;
  const origInfo = console.info;
  const fmt = (a) => { try { return typeof a === "string" ? a : JSON.stringify(a); } catch { return String(a); } };
  console.log = (...args) => __logs.push(args.map(fmt).join(" "));
  console.warn = (...args) => __logs.push("[warn] " + args.map(fmt).join(" "));
  console.info = (...args) => __logs.push("[info] " + args.map(fmt).join(" "));

  try {
    const fn = new AsyncFunction("__input", code);
    const result = await fn(input);

    console.log = origLog;
    console.warn = origWarn;
    console.info = origInfo;

    // The 1 MB output cap exists to keep huge tool results from blowing up
    // the chat context. When `unboundedOutput` is set (the tool layer does
    // this for `saveAs` calls), the result is going straight to /workspace
    // and never enters chat, so the cap is counterproductive — it would
    // block exactly the case `saveAs` was built for. We still verify the
    // result is structured-cloneable below by letting `postMessage` do it.
    if (!unboundedOutput) {
      try {
        const serialized = JSON.stringify(result);
        if (serialized && serialized.length > MAX_OUTPUT_BYTES) {
          reply({ error: "Output exceeds 1MB limit", logs: __logs });
          return;
        }
      } catch {
        reply({ error: "Result not serializable", logs: __logs });
        return;
      }
    }

    reply({ result, logs: __logs });
  } catch (err) {
    console.log = origLog;
    console.warn = origWarn;
    console.info = origInfo;
    reply({ error: err instanceof Error ? err.message : String(err), logs: __logs });
  }
});
</script>
</body>
</html>
