<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<script>
"use strict";

const TIMEOUT_MS = 30000;
const MAX_OUTPUT_BYTES = 1048576;

window.addEventListener("message", async (e) => {
  const { id, code, input, unboundedOutput } = e.data;
  if (!id || !code) return;

  let timeoutId = null;
  let resolved = false;

  function reply(result) {
    if (resolved) return;
    resolved = true;
    if (timeoutId) clearTimeout(timeoutId);
    e.source.postMessage({ id, ...result }, "*");
  }

  timeoutId = setTimeout(() => {
    reply({ error: "Execution timed out after 30s", logs: [] });
  }, TIMEOUT_MS);

  const __logs = [];
  const origLog = console.log;
  const origWarn = console.warn;
  const origInfo = console.info;
  const fmt = (a) => { try { return typeof a === "string" ? a : JSON.stringify(a); } catch { return String(a); } };
  console.log = (...args) => __logs.push(args.map(fmt).join(" "));
  console.warn = (...args) => __logs.push("[warn] " + args.map(fmt).join(" "));
  console.info = (...args) => __logs.push("[info] " + args.map(fmt).join(" "));

  try {
    const fn = new Function("__input", code);
    const result = await fn(input);

    console.log = origLog;
    console.warn = origWarn;
    console.info = origInfo;

    // The 1 MB output cap exists to keep huge tool results from blowing up
    // the chat context. When `unboundedOutput` is set (the tool layer does
    // this for `saveAs` calls), the result is going straight to /workspace
    // and never enters chat, so the cap is counterproductive — it would
    // block exactly the case `saveAs` was built for. We still verify the
    // result is structured-cloneable below by letting `postMessage` do it.
    if (!unboundedOutput) {
      try {
        const serialized = JSON.stringify(result);
        if (serialized && serialized.length > MAX_OUTPUT_BYTES) {
          reply({ error: "Output exceeds 1MB limit", logs: __logs });
          return;
        }
      } catch {
        reply({ error: "Result not serializable", logs: __logs });
        return;
      }
    }

    reply({ result, logs: __logs });
  } catch (err) {
    console.log = origLog;
    console.warn = origWarn;
    console.info = origInfo;
    reply({ error: err instanceof Error ? err.message : String(err), logs: __logs });
  }
});
</script>
</body>
</html>
